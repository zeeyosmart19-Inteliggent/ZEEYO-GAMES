  <style>
/* FOOD FRENZY — CREATED BY ZEEYO */
:root {
  --bg: #0d0b10; --glass: rgba(22, 18, 28, 0.78); --glass2: rgba(34, 28, 44, 0.86); --line: rgba(255, 255, 255, 0.09);
  --text: #fff8f0; --dim: #b9adbd; --faint: #7d7285;
  --accent: #ff7a3c; --accent2: #ff3d7f; --gold: #ffcc3a; --gem: #4fd8ff; --token: #b98cff; --ok: #5fd38a; --bad: #ff5a5a;
  --r-common: #b8c1cc; --r-uncommon: #5fd38a; --r-rare: #4fa8ff; --r-epic: #b57bff; --r-legendary: #ffb23f; --r-mythical: #ff4f8b; --r-secret: #3fffe0;
  --rail: 84px; --radius: 18px;
  --font: 'Fredoka', 'Baloo 2', ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); overflow: hidden; overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }

/* ---------- startup ---------- */
#startup { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 40%, #3a1c2e 0%, #120a12 60%, #070507 100%); transition: opacity .7s ease, visibility .7s; text-align: center; }
#startup.gone, #startup.gone * { opacity: 0; visibility: hidden; pointer-events: none !important; }
.splash-pre { letter-spacing: .5em; font-size: 13px; color: var(--dim); margin-bottom: 18px; opacity: 0; animation: fadeUp .8s .2s forwards; }
.logo { font-weight: 800; font-size: clamp(54px, 12vw, 132px); line-height: .9; letter-spacing: -.02em; }
.logo span { display: inline-block; background: linear-gradient(180deg, #ffe08a 0%, #ff9a3c 45%, #ff3d7f 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 6px 0 #7a1f3a) drop-shadow(0 18px 30px rgba(255, 90, 60, .35)); animation: letterIn .7s cubic-bezier(.2, 1.6, .4, 1) both, letterBob 3s ease-in-out infinite; }
.logo .row2 span { background: linear-gradient(180deg, #fff 0%, #ffd6e8 40%, #ff5fa2 100%); -webkit-background-clip: text; background-clip: text; }
@keyframes letterIn { from { transform: translateY(80px) scale(.3) rotate(-12deg); opacity: 0; } }
@keyframes letterBob { 50% { transform: translateY(-6px) rotate(1.5deg); } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.splash-by { margin-top: 26px; font-size: 15px; letter-spacing: .32em; color: #ffd9b8; text-shadow: 0 0 18px rgba(255, 140, 80, .6); opacity: 0; animation: fadeUp .8s 1s forwards; }
.load { width: min(340px, 70vw); margin: 34px auto 0; opacity: 0; animation: fadeUp .6s 1.2s forwards; }
.load-bar { height: 10px; border-radius: 99px; background: rgba(255, 255, 255, .08); overflow: hidden; }
.load-bar i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--gold), var(--accent), var(--accent2)); transition: width .25s; box-shadow: 0 0 18px var(--accent); }
.load-text { margin-top: 10px; font-size: 13px; color: var(--dim); min-height: 1.2em; }
.tap { margin-top: 26px; display: none; padding: 16px 44px; font-size: 22px; font-weight: 700; border-radius: 99px; background: linear-gradient(180deg, #ffb44f, #ff5a3c); box-shadow: 0 8px 0 #9a2e1c, 0 20px 40px rgba(255, 90, 60, .4); animation: pulse 1.4s ease-in-out infinite; }
#startup.ready .tap { display: inline-block; }
@keyframes pulse { 50% { transform: scale(1.06); } }
.crumbs-bg { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.crumbs-bg i { position: absolute; width: 8px; height: 8px; border-radius: 50%; opacity: .5; animation: drift linear infinite; }
@keyframes drift { from { transform: translateY(110vh) rotate(0); } to { transform: translateY(-10vh) rotate(720deg); } }

/* ---------- HUD ---------- */
#hud { position: fixed; top: 0; left: var(--rail); right: 0; z-index: 10; padding: 14px 18px; display: flex; align-items: flex-start; gap: 12px; pointer-events: none; }
#hud > * { pointer-events: auto; }
.wallet { display: flex; flex-direction: column; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px 6px 8px; border-radius: 99px; background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--line); font-weight: 600; font-size: 15px; min-width: 96px; }
.ico { width: 22px; height: 22px; flex: none; display: inline-block; }
.ico.coin { border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff6c4 0 18%, #ffd34a 30%, #e09a12 75%, #a86a08 100%); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .25), 0 0 10px rgba(255, 200, 60, .45); }
.ico.gem { background: linear-gradient(135deg, #b8f4ff 0%, #4fd8ff 40%, #2a7cff 100%); clip-path: polygon(50% 0, 100% 35%, 50% 100%, 0 35%); filter: drop-shadow(0 0 6px rgba(79, 216, 255, .7)); }
.ico.token { border-radius: 6px; transform: rotate(45deg) scale(.8); background: linear-gradient(135deg, #f1dcff, #b98cff 50%, #6a3cff); box-shadow: 0 0 10px rgba(185, 140, 255, .6); }
.score { flex: 1; text-align: center; pointer-events: none; }
.score .big { display: inline-flex; align-items: center; gap: 12px; font-size: clamp(32px, 5vw, 54px); font-weight: 800; letter-spacing: -.01em; text-shadow: 0 4px 0 rgba(0, 0, 0, .35), 0 0 30px rgba(255, 190, 60, .3); }
.score .big .ico { width: 38px; height: 38px; }
.score .rate { font-size: 15px; color: var(--dim); margin-top: 2px; }
.score.bump .big { animation: bump .18s; }
@keyframes bump { 50% { transform: scale(1.06); } }
.hud-right { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.chip { padding: 5px 12px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(10px); white-space: nowrap; }
.chip.event { border-color: rgba(255, 204, 58, .5); color: #ffe39a; box-shadow: 0 0 16px rgba(255, 204, 58, .18); }
.chip.boost { border-color: rgba(95, 211, 138, .5); color: #b8ffd3; }
.chip.frenzy { border-color: #ff8a3c; color: #fff; background: linear-gradient(90deg, #ff5a3c, #ff3d7f); animation: pulse .5s infinite; }
.world-btn { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 14px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(14px); font-weight: 600; font-size: 14px; transition: transform .15s; }
.world-btn:hover { transform: translateY(-2px); }
.world-dot { width: 14px; height: 14px; border-radius: 50%; box-shadow: 0 0 10px currentColor; }

/* food label + HP + frenzy meter */
#hud .score, #foodbar { transition: transform .45s cubic-bezier(.2, .9, .2, 1); }
body.panel-open #hud .score { transform: translateX(-235px); }
body.panel-open #foodbar { transform: translateX(calc(-50% - 245px)); }
#foodbar { position: fixed; left: calc(50% + var(--rail) / 2); bottom: 26px; transform: translateX(-50%); z-index: 9; text-align: center; pointer-events: none; width: min(420px, 80vw); }
.food-name { font-size: 22px; font-weight: 700; text-shadow: 0 3px 12px rgba(0, 0, 0, .6); }
.rbadge { display: inline-block; margin-left: 8px; padding: 2px 10px; border-radius: 99px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; vertical-align: 4px; color: #120a12; }
.meter { margin-top: 8px; height: 10px; border-radius: 99px; background: rgba(0, 0, 0, .45); border: 1px solid var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; width: 100%; border-radius: 99px; transition: width .12s; }
.meter.hp i { background: linear-gradient(90deg, #ff5a3c, #ffcc3a); }
.meter.fz { height: 6px; margin-top: 6px; }
.meter.fz i { background: linear-gradient(90deg, #ff3d7f, #ff9a3c, #ffe08a); box-shadow: 0 0 12px #ff7a3c; }
.food-sub { margin-top: 6px; font-size: 12px; color: var(--dim); }

/* ---------- navigation rail ---------- */
#nav { position: fixed; z-index: 20; left: 0; top: 0; bottom: 0; width: var(--rail); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 0; background: linear-gradient(180deg, rgba(20, 14, 22, .88), rgba(12, 9, 14, .92)); border-right: 1px solid var(--line); backdrop-filter: blur(16px); }
.brand { font-weight: 800; font-size: 13px; line-height: 1; text-align: center; margin: 4px 0 12px; background: linear-gradient(180deg, #ffe08a, #ff3d7f); -webkit-background-clip: text; background-clip: text; color: transparent; }
.nav-btn { position: relative; width: 70px; padding: 8px 0 6px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 600; color: var(--dim); transition: background .2s, color .2s, transform .15s; }
.nav-btn svg { width: 24px; height: 24px; transition: transform .25s cubic-bezier(.2, 1.6, .4, 1); }
.nav-btn:hover { color: var(--text); background: rgba(255, 255, 255, .05); }
.nav-btn:hover svg { transform: translateY(-2px) scale(1.08); }
.nav-btn.on { color: #fff; background: linear-gradient(180deg, rgba(255, 122, 60, .28), rgba(255, 61, 127, .18)); box-shadow: inset 0 0 0 1px rgba(255, 140, 80, .4); }
.nav-btn .dot { position: absolute; top: 6px; right: 14px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent2); box-shadow: 0 0 8px var(--accent2); display: none; }
.nav-btn.alert .dot { display: block; animation: pulse 1s infinite; }

/* ---------- panels ---------- */
#panel { position: fixed; z-index: 30; top: 12px; bottom: 12px; right: 12px; width: min(470px, calc(100vw - var(--rail) - 24px)); border-radius: 24px; background: var(--glass2); border: 1px solid var(--line); backdrop-filter: blur(22px) saturate(1.2); -webkit-backdrop-filter: blur(22px) saturate(1.2); box-shadow: 0 30px 80px rgba(0, 0, 0, .55); display: flex; flex-direction: column; transform: translateX(calc(100% + 30px)); transition: transform .45s cubic-bezier(.2, .9, .2, 1); }
#panel.open { transform: none; }
.panel-head { display: flex; align-items: center; gap: 10px; padding: 18px 20px 12px; }
.panel-head h2 { margin: 0; font-size: 24px; font-weight: 800; flex: 1; }
.close { width: 36px; height: 36px; border-radius: 12px; background: rgba(255, 255, 255, .07); font-size: 20px; line-height: 1; transition: transform .2s, background .2s; }
.close:hover { background: rgba(255, 255, 255, .14); transform: rotate(90deg); }
.panel-body { flex: 1; overflow-y: auto; padding: 4px 20px 24px; scrollbar-width: thin; }
.panel-body > * { animation: fadeUp .4s both; }
.tabs { display: flex; gap: 6px; padding: 0 20px 10px; overflow-x: auto; }
.tab { padding: 8px 14px; border-radius: 12px; font-size: 13px; font-weight: 700; color: var(--dim); background: rgba(255, 255, 255, .05); white-space: nowrap; transition: all .2s; }
.tab.on { color: #1a0d10; background: linear-gradient(180deg, #ffd27a, #ff8a3c); }
.section-t { margin: 18px 0 8px; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }
.note { font-size: 13px; color: var(--dim); line-height: 1.5; background: rgba(255, 255, 255, .04); border-radius: 14px; padding: 12px 14px; border: 1px dashed var(--line); }

/* cards and rows */
.card { position: relative; border-radius: var(--radius); background: rgba(255, 255, 255, .045); border: 1px solid var(--line); padding: 14px; transition: transform .2s, background .2s, border-color .2s; }
.card:hover { background: rgba(255, 255, 255, .07); }
.row { display: flex; align-items: center; gap: 12px; }
.row + .row, .card + .card { margin-top: 10px; }
.grow { flex: 1; min-width: 0; }
.title { font-weight: 700; font-size: 16px; }
.desc { font-size: 12.5px; color: var(--dim); margin-top: 3px; line-height: 1.4; }
.lvl { font-size: 12px; color: var(--gold); font-weight: 700; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 16px; border-radius: 14px; font-weight: 700; font-size: 14px; background: linear-gradient(180deg, #ffb44f, #ff6a3c); color: #2a0f06; box-shadow: 0 4px 0 #a33b1c; transition: transform .1s, filter .2s, box-shadow .1s; white-space: nowrap; }
.btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #a33b1c; }
.btn.gem { background: linear-gradient(180deg, #8eeaff, #2a9cff); box-shadow: 0 4px 0 #1a5a9a; color: #04182a; }
.btn.token { background: linear-gradient(180deg, #e2c8ff, #9a5cff); box-shadow: 0 4px 0 #4a2a9a; color: #160a2a; }
.btn.ghost { background: rgba(255, 255, 255, .08); color: var(--text); box-shadow: none; }
.btn.ok { background: linear-gradient(180deg, #8affb4, #2fbf6a); box-shadow: 0 4px 0 #1a7a42; color: #04200f; }
.btn[disabled], .btn.off { filter: grayscale(.85) brightness(.6); pointer-events: none; }
.btn .ico { width: 16px; height: 16px; }
.price { font-weight: 700; display: inline-flex; align-items: center; gap: 5px; }
.bar { height: 8px; border-radius: 99px; background: rgba(0, 0, 0, .4); overflow: hidden; margin-top: 8px; }
.bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent2), var(--accent), var(--gold)); }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat { border-radius: 14px; padding: 10px 12px; background: rgba(255, 255, 255, .04); border: 1px solid var(--line); }
.stat b { display: block; font-size: 18px; }
.stat span { font-size: 11.5px; color: var(--dim); }

/* food grid */
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.fcard { position: relative; aspect-ratio: .82; border-radius: 16px; overflow: hidden; background: rgba(0, 0, 0, .35); border: 2px solid transparent; transition: transform .2s cubic-bezier(.2, 1.6, .4, 1), border-color .2s; text-align: center; }
.fcard:hover { transform: translateY(-3px) scale(1.03); }
.fcard img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
.fcard .fn { font-size: 10.5px; font-weight: 600; padding: 3px 4px 0; line-height: 1.15; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.fcard img:not([src]) { visibility: hidden; }
.fcard.locked img { filter: grayscale(1) brightness(.12) contrast(1.4); }
.fcard.locked .fn { color: var(--faint); }
.fcard.active { border-color: var(--gold); box-shadow: 0 0 18px rgba(255, 204, 58, .4); }
.fcard .lv { position: absolute; top: 5px; left: 5px; font-size: 10px; font-weight: 800; padding: 1px 6px; border-radius: 99px; background: rgba(0, 0, 0, .55); }
.fcard .rr { position: absolute; top: 0; right: 0; width: 0; height: 0; border-style: solid; border-width: 0 22px 22px 0; }
.fcard.shine::after { content: ''; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, .25) 45%, transparent 60%); background-size: 250% 100%; animation: shine 2.6s infinite; pointer-events: none; }
@keyframes shine { from { background-position: 150% 0; } to { background-position: -50% 0; } }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.fchip { padding: 5px 10px; border-radius: 99px; font-size: 11.5px; font-weight: 700; background: rgba(255, 255, 255, .06); color: var(--dim); }
.fchip.on { background: #fff; color: #1a0d10; }

.detail { display: flex; flex-direction: column; align-items: center; text-align: center; }
.detail canvas { width: 240px; height: 240px; border-radius: 24px; background: #000; }

/* worlds */
.wcard { position: relative; border-radius: 20px; overflow: hidden; padding: 16px; min-height: 110px; display: flex; flex-direction: column; justify-content: flex-end; border: 1px solid var(--line); transition: transform .2s; }
.wcard:hover { transform: translateY(-2px); }
.wcard + .wcard { margin-top: 10px; }
.wcard .wn { font-size: 19px; font-weight: 800; text-shadow: 0 2px 10px rgba(0, 0, 0, .6); }
.wcard .wt { font-size: 12.5px; opacity: .85; }
.wcard .wb { position: absolute; top: 14px; right: 14px; }
.wcard.locked { filter: saturate(.4); }

/* daily */
.days { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.day { border-radius: 16px; padding: 12px 6px; text-align: center; background: rgba(255, 255, 255, .05); border: 1px solid var(--line); font-size: 12px; }
.day b { display: block; font-size: 11px; color: var(--faint); margin-bottom: 6px; letter-spacing: .1em; }
.day.done { opacity: .45; }
.day.today { border-color: var(--gold); background: rgba(255, 204, 58, .1); box-shadow: 0 0 22px rgba(255, 204, 58, .25); animation: pulse 1.6s infinite; }
.day:last-child { grid-column: span 2; }

/* achievements */
.agrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ach { border-radius: 14px; padding: 10px 12px; background: rgba(255, 255, 255, .04); border: 1px solid var(--line); }
.ach.got { border-color: rgba(255, 204, 58, .45); background: linear-gradient(135deg, rgba(255, 204, 58, .14), rgba(255, 122, 60, .06)); }
.ach .an { font-weight: 700; font-size: 13.5px; }
.ach .ad { font-size: 11.5px; color: var(--dim); margin-top: 2px; }
.ach:not(.got) .an { color: var(--dim); }

/* inputs */
.field { width: 100%; padding: 12px 14px; border-radius: 14px; background: rgba(0, 0, 0, .35); border: 1px solid var(--line); color: var(--text); font: inherit; font-size: 15px; }
textarea.field { min-height: 90px; resize: vertical; font-family: ui-monospace, monospace; font-size: 11px; }
input[type=range] { width: 100%; accent-color: var(--accent); }
select.field { appearance: none; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.set-row > :last-child { width: 55%; max-width: 230px; }
.switch { position: relative; width: 50px !important; height: 28px; border-radius: 99px; background: rgba(255, 255, 255, .15); transition: background .2s; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .25s cubic-bezier(.2, 1.6, .4, 1); }
.switch.on { background: var(--ok); }
.switch.on::after { transform: translateX(22px); }

/* ---------- floating numbers + toasts + modal ---------- */
#floats { position: fixed; inset: 0; pointer-events: none; z-index: 15; overflow: hidden; }
.float { position: absolute; font-weight: 800; font-size: 22px; color: #fff6c4; text-shadow: 0 2px 0 #a8580a, 0 0 12px rgba(255, 180, 40, .7); white-space: nowrap; animation: floatUp .95s cubic-bezier(.2, .8, .3, 1) forwards; transform: translate(-50%, -50%); }
.float.crit { font-size: 34px; color: #ffe08a; text-shadow: 0 3px 0 #b3261e, 0 0 22px rgba(255, 80, 40, .9); }
.float.crit::before { content: 'CRIT! '; font-size: .6em; color: #ff8a6a; }
.float.dbl { color: #b8ffd3; text-shadow: 0 2px 0 #1a7a42; }
.float.gem { color: #b8f4ff; text-shadow: 0 2px 0 #1a5a9a, 0 0 14px rgba(79, 216, 255, .9); }
.float.burst { font-size: 40px; color: #fff; text-shadow: 0 4px 0 #ff3d7f, 0 0 30px #ff7a3c; animation-duration: 1.4s; }
@keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.5); } 15% { opacity: 1; transform: translate(-50%, -80%) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -260%) scale(.9); } }
#toasts { position: fixed; z-index: 60; top: 86px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { display: flex; align-items: center; gap: 12px; padding: 10px 18px 10px 12px; border-radius: 18px; background: var(--glass2); border: 1px solid rgba(255, 204, 58, .4); backdrop-filter: blur(16px); box-shadow: 0 14px 40px rgba(0, 0, 0, .45); animation: toastIn .5s cubic-bezier(.2, 1.6, .4, 1), toastOut .4s 3.2s forwards; font-size: 14px; }
.toast img { width: 40px; height: 40px; border-radius: 10px; }
.toast .tk { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-20px) scale(.8); } }
@keyframes toastOut { to { opacity: 0; transform: translateY(-14px); } }
#modal { position: fixed; inset: 0; z-index: 80; display: none; place-items: center; background: rgba(5, 3, 8, .72); backdrop-filter: blur(6px); }
#modal.show { display: grid; animation: fadeIn .25s; }
@keyframes fadeIn { from { opacity: 0; } }
.mbox { width: min(420px, 90vw); border-radius: 28px; padding: 26px 22px 22px; background: var(--glass2); border: 1px solid var(--line); text-align: center; box-shadow: 0 40px 100px rgba(0, 0, 0, .6); animation: popIn .5s cubic-bezier(.2, 1.5, .4, 1); }
@keyframes popIn { from { transform: scale(.6); opacity: 0; } }
.mbox h3 { margin: 0 0 6px; font-size: 26px; }
.mbox .btns { display: flex; gap: 10px; justify-content: center; margin-top: 18px; }
/* crate reveal */
.crate { width: 150px; height: 150px; margin: 10px auto; position: relative; }
.crate .box { position: absolute; inset: 18px; border-radius: 18px; background: repeating-linear-gradient(90deg, #a8692e 0 22px, #8a5422 22px 26px); box-shadow: inset 0 0 0 6px #6a3e18, 0 18px 40px rgba(0, 0, 0, .5); animation: shake .12s infinite; }
.crate .box::before { content: ''; position: absolute; left: -6px; right: -6px; top: 30%; height: 18px; background: #ffcc3a; box-shadow: 0 0 20px #ffcc3a; }
.crate.gourmet .box { background: repeating-linear-gradient(90deg, #2a6cff 0 22px, #1a4ab8 22px 26px); box-shadow: inset 0 0 0 6px #10307a, 0 18px 40px rgba(0, 0, 0, .5); }
.crate.royal .box { background: repeating-linear-gradient(90deg, #7a1430 0 22px, #5a0c22 22px 26px); box-shadow: inset 0 0 0 6px #3a0614, 0 0 50px rgba(255, 204, 58, .5); }
@keyframes shake { 25% { transform: rotate(-4deg) translateY(-2px); } 75% { transform: rotate(4deg); } }
.reveal { position: relative; width: 220px; height: 220px; margin: 0 auto; }
.reveal img { position: relative; width: 100%; border-radius: 26px; animation: popIn .6s cubic-bezier(.2, 1.6, .4, 1); }
.reveal .rays { position: absolute; inset: -60px; border-radius: 50%; background: repeating-conic-gradient(var(--rc) 0 8deg, transparent 8deg 22deg); opacity: .45; animation: spin 6s linear infinite; mask: radial-gradient(circle, #000 30%, transparent 70%); -webkit-mask: radial-gradient(circle, #000 30%, transparent 70%); }
@keyframes spin { to { transform: rotate(360deg); } }
.rname { font-size: 13px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; margin-top: 12px; }

/* ---------- mobile ---------- */
@media (max-width: 760px) {
  :root { --rail: 0px; }
  #nav { top: auto; bottom: 0; left: 0; right: 0; width: auto; height: 68px; flex-direction: row; padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); overflow-x: auto; border-right: 0; border-top: 1px solid var(--line); gap: 0; height: calc(68px + env(safe-area-inset-bottom)); }
  .brand { display: none; }
  .nav-btn { flex: none; width: 66px; }
  #hud { padding: 10px 10px 0; gap: 8px; }
  .pill { min-width: 0; font-size: 13px; padding: 4px 10px 4px 6px; }
  .ico { width: 18px; height: 18px; }
  .score .big .ico { width: 28px; height: 28px; }
  .score .rate { font-size: 12px; }
  .world-btn span:not(.world-dot) { display: none; }
  #foodbar { bottom: calc(84px + env(safe-area-inset-bottom)); }
  .food-name { font-size: 18px; }
  #panel { top: auto; left: 8px; right: 8px; bottom: calc(76px + env(safe-area-inset-bottom)); width: auto; height: 72vh; transform: translateY(calc(100% + 100px)); }
  #toasts { top: 74px; width: 92vw; }
  .chip { font-size: 10.5px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }

/* ---------- menu button + main menu ---------- */
.menu-btn { display: flex; align-items: center; gap: 8px; padding: 8px 14px 8px 10px; border-radius: 14px; background: linear-gradient(180deg, rgba(255, 122, 60, .9), rgba(255, 61, 127, .85)); font-weight: 700; font-size: 14px; box-shadow: 0 4px 0 rgba(122, 31, 58, .9), 0 10px 24px rgba(255, 80, 80, .3); transition: transform .15s; align-self: flex-start; }
.menu-btn svg { width: 20px; height: 20px; }
.menu-btn:hover { transform: translateY(-2px); }
.menu-btn:active { transform: translateY(2px); }
#mainmenu { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; text-align: center; padding: 20px; background: radial-gradient(ellipse at 50% 35%, rgba(70, 24, 52, .9) 0%, rgba(18, 10, 18, .95) 65%); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); opacity: 0; visibility: hidden; transition: opacity .4s, visibility .4s; overflow-y: auto; }
#mainmenu.show { opacity: 1; visibility: visible; }
#mainmenu .logo { font-size: clamp(48px, 10vw, 110px); }
.mm-stats { margin-top: 18px; font-size: 15px; color: var(--dim); display: flex; align-items: center; justify-content: center; gap: 6px; }
.mm-stats .ico { width: 18px; height: 18px; }
.mm-play { display: inline-block; margin-top: 22px; }
.mm-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: min(460px, 90vw); margin: 26px auto 0; }
.mm-btn { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 6px; border-radius: 18px; background: rgba(255, 255, 255, .06); border: 1px solid var(--line); font-weight: 600; font-size: 13px; transition: transform .2s cubic-bezier(.2, 1.6, .4, 1), background .2s; }
.mm-btn svg { width: 26px; height: 26px; color: #ffb27a; }
.mm-btn:hover { transform: translateY(-3px); background: rgba(255, 255, 255, .11); }
#mainmenu .splash-by { margin-top: 24px; }
@media (max-width: 760px) { .menu-btn span { display: none; } .menu-btn { padding: 8px; } .mm-grid { gap: 8px; } }

/* food switch arrows + inventory items */
.fswitch { pointer-events: auto; width: 34px; height: 34px; margin: 0 10px; border-radius: 50%; font-size: 26px; line-height: 30px; font-weight: 700; vertical-align: 3px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(10px); transition: transform .15s, background .2s; }
.fswitch:hover { background: rgba(255, 255, 255, .15); transform: scale(1.12); }
.fswitch:active { transform: scale(.92); }
.itm { width: 54px; height: 54px; flex: none; border-radius: 14px; position: relative; }
.crate-ic { background: repeating-linear-gradient(90deg, #a8692e 0 10px, #8a5422 10px 12px); box-shadow: inset 0 0 0 3px #6a3e18; }
.crate-ic::before { content: ''; position: absolute; left: -3px; right: -3px; top: 38%; height: 8px; background: #ffcc3a; }
.crate-ic.gourmet { background: repeating-linear-gradient(90deg, #2a6cff 0 10px, #1a4ab8 10px 12px); box-shadow: inset 0 0 0 3px #10307a; }
.crate-ic.royal { background: repeating-linear-gradient(90deg, #7a1430 0 10px, #5a0c22 10px 12px); box-shadow: inset 0 0 0 3px #3a0614, 0 0 14px rgba(255, 204, 58, .5); }
.boost-ic { border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff 0 10%, transparent 30%), linear-gradient(180deg, #8eeaff, #2a7cff); box-shadow: 0 0 16px rgba(79, 216, 255, .5); }
.boost-ic.boost_coins2 { background: radial-gradient(circle at 35% 30%, #fff 0 10%, transparent 30%), linear-gradient(180deg, #ffe08a, #ff9a1a); box-shadow: 0 0 16px rgba(255, 190, 40, .6); }
.boost-ic.boost_frenzy { background: radial-gradient(circle at 35% 30%, #fff 0 10%, transparent 30%), linear-gradient(180deg, #ff9ac0, #ff3d7f); box-shadow: 0 0 16px rgba(255, 61, 127, .6); }
.boost-ic.boost_knife { border-radius: 14px; background: linear-gradient(135deg, #f2f4f8 0 45%, #9aa4b4 45% 55%, #5a3424 55%); }

/* National Foods crates: cobalt-and-white Uzbek ceramic pattern with a gold band */
.crate.national .box, .crate.national_feast .box { background: radial-gradient(circle at 50% 50%, #ffffff 0 7px, transparent 8px) 0 0 / 28px 28px, radial-gradient(circle at 50% 50%, #3fb8d8 0 3px, transparent 4px) 14px 14px / 28px 28px, #1e3f9a; box-shadow: inset 0 0 0 6px #102a6a, 0 18px 40px rgba(0, 0, 0, .5); }
.crate.national_feast .box { box-shadow: inset 0 0 0 6px #102a6a, 0 0 50px rgba(255, 204, 58, .6); }
.crate-ic.national, .crate-ic.national_feast { background: radial-gradient(circle at 50% 50%, #ffffff 0 3px, transparent 4px) 0 0 / 12px 12px, #1e3f9a; box-shadow: inset 0 0 0 3px #102a6a; }
.crate-ic.national_feast { box-shadow: inset 0 0 0 3px #102a6a, 0 0 14px rgba(255, 204, 58, .6); }
.natflag { display: inline-block; width: 18px; height: 12px; margin-right: 7px; vertical-align: -1px; border-radius: 2px; background: linear-gradient(#1eb5e6 0 33%, #d8202a 33% 36%, #fff 36% 64%, #d8202a 64% 67%, #1eaa3a 67%); box-shadow: 0 0 0 1px rgba(255,255,255,.3); }

</style>

  <canvas id="game"></canvas>
  <div id="startup">
    <div class="crumbs-bg" id="crumbsBg"></div>
    <div>
      <div class="splash-pre">A GAME CREATED BY ZEEYO</div>
      <div class="logo"><div class="row1"><span>F</span><span>O</span><span>O</span><span>D</span></div><div class="row2"><span>F</span><span>R</span><span>E</span><span>N</span><span>Z</span><span>Y</span></div></div>
      <div class="splash-by">CREATED BY ZEEYO</div>
      <div class="load"><div class="load-bar"><i id="loadFill"></i></div><div class="load-text" id="loadText">Loading…</div></div>
      <button class="tap">TAP TO PLAY</button>

  <noscript>FOOD FRENZY needs JavaScript and a browser with WebGL2.</noscript>

  setFood(f) {

  setWorld(w) { const b = $('#worldBtn'); b.querySelector('.world-dot').style.cssText = `background:${w.rim};color:${w.rim}`; b.querySelector('span:last-child').textContent = w.name; }
  _chips() {

    for (const b of e.s.boosts) out.push(`<div class="chip boost">2x Coins · ${Math.ceil((b.until - e.now()) / 60000)}m</div>`);
    for (const ev of e.events()) out.push(`<div class="chip event" title="${esc(ev.desc)}">★ ${esc(ev.name)}</div>`);

  _alerts() {
    const e = this.eco, s = this.s;
    const set = (p, on) => document.querySelector(`.nav-btn[data-page="${p}"]`)?.classList.toggle('alert', !!on);
    set('daily', e.dailyStatus().claimable);
    set('inventory', Object.keys(s.items || {}).some((k) => ITEMS[k]?.kind === 'crate'));
    set('missions', s.missions.list.some((m) => !m.claimed && m.progress >= m.target));
    set('upgrades', UPGRADES.some((u) => e.lvl(u.id) < u.max && s.coins >= e.upgradePrice(u)) || PRODUCERS.some((p) => s.coins >= e.producerPrice(p)));

  // ------------------------------------------------------------ main menu (title screen)

      $('#mmStats').innerHTML = `<i class="ico coin"></i> ${fmt(s.coins)} &nbsp;·&nbsp; ${Object.keys(s.owned).length}/100 foods &nbsp;·&nbsp; ${fmt(e.cps())}/sec`;
      for (const [i, sp] of [...document.querySelectorAll('.mm-logo span')].entries()) { sp.style.animation = 'none'; void sp.offsetWidth; sp.style.animation = ''; sp.style.animationDelay = `${i * 0.06}s, ${0.8 + i * 0.15}s`; }
    }
    $('#mainmenu').classList.toggle('show', on);
  }

  // ------------------------------------------------------------ floating numbers, toasts, modal
  float(x, y, text, cls = '') {
    const layer = $('#floats');
    if (layer.childElementCount > 45) layer.firstChild.remove();
    const d = document.createElement('div');
    d.className = 'float ' + cls; d.textContent = text;
    d.style.left = x + (Math.random() - 0.5) * 30 + 'px'; d.style.top = y + 'px';
    layer.appendChild(d);
    setTimeout(() => d.remove(), 1500);
  }
  bump() { const sc = $('#score'); sc.classList.remove('bump'); void sc.offsetWidth; sc.classList.add('bump'); }
  toast(kicker, text, food = null) {
    const t = document.createElement('div'); t.className = 'toast';
    const img = food ? `<img data-thumb="${food.id}" alt="">` : '';
    t.innerHTML = `${img}<div><div class="tk">${esc(kicker)}</div><div>${esc(text)}</div></div>`;
    $('#toasts').appendChild(t);
    if (food) this.app.thumb(food, (u) => { const i = t.querySelector('img'); if (i) i.src = u; });
    setTimeout(() => t.remove(), 3700);
  }
  modal(html, { dismiss = true } = {}) { $('#mBox').innerHTML = html; $('#modal').classList.add('show'); this._modalDismiss = dismiss; return $('#mBox'); }
  closeModal() { $('#modal').classList.remove('show'); }

  // ------------------------------------------------------------ pages
  open(page) {
    this.page = page;
    for (const b of document.querySelectorAll('.nav-btn')) b.classList.toggle('on', b.dataset.page === page);
    const panel = $('#panel');
    const wide = innerWidth > 760;
    document.body.classList.toggle('panel-open', !!page && wide);
    // world units to pan so the food centres in the space left of the panel
    this.app.view.panTarget = page && wide ? Math.min(2.6, (panel.offsetWidth / innerWidth) * 4.2) : 0;
    if (!page) { panel.classList.remove('open'); this.refresh = null; return; }
    panel.classList.add('open');
    this.render();
  }
  render() {
    const page = this.page; if (!page) return;
    $('#pTitle').textContent = PAGES.find((p) => p[0] === page)[1];
    $('#pTabs').innerHTML = ''; $('#pTabs').style.display = 'none';
    const body = $('#pBody'), keep = body.scrollTop;
    this.refresh = null;
    body.innerHTML = '';
    this['p_' + page](body);
    if (this._keepScroll) body.scrollTop = keep;
    this._keepScroll = false;
  }
  rerender() { this._keepScroll = true; this.render(); }
  tabs(list, key, def) {
    const cur = this.tab[key] || def; this.tab[key] = cur;
    const el = $('#pTabs'); el.style.display = 'flex';
    el.innerHTML = list.map(([id, name]) => `<button class="tab ${id === cur ? 'on' : ''}" data-t="${id}">${name}</button>`).join('');
    el.onclick = (e) => { const t = e.target.closest('.tab'); if (!t) return; this.app.audio.ui(); this.tab[key] = t.dataset.t; this.render(); };
    return cur;
  }
  // thumbnails render only when they scroll into view, so a 380-food collection opens instantly
  _thumbs(root) {
    const load = (img) => { const f = FOODS.find((x) => x.id === img.dataset.thumb); if (f) this.app.thumb(f, (u) => { img.src = u; }); };
    const imgs = root.querySelectorAll('img[data-thumb]');
    if (!('IntersectionObserver' in window)) { imgs.forEach(load); return; }
    if (this._io) this._io.disconnect();
    // observe against the scrolling panel itself, so cards just below the fold are prepared before you reach them
    const scroller = root.closest && root.closest('#pBody');
    this._io = new IntersectionObserver((es) => { for (const en of es) if (en.isIntersecting) { this._io.unobserve(en.target); load(en.target); } }, { root: scroller || null, rootMargin: '400px 0px' });
    imgs.forEach((img) => this._io.observe(img));
  }

  // INVENTORY
  p_inventory(b) {
    const tab = this.tabs([['foods', 'Foods'], ['items', 'Items']], 'inv', 'foods');

      let list = FOODS.filter((f) => s.owned[f.id]);
      if (sort === 'rarity') list.sort((a, c) => ri(c) - ri(a) || s.owned[c.id].lvl - s.owned[a.id].lvl);
      if (sort === 'level') list.sort((a, c) => s.owned[c.id].lvl - s.owned[a.id].lvl || ri(c) - ri(a));
      if (sort === 'newest') list.sort((a, c) => (s.owned[c.id].at || 0) - (s.owned[a.id].at || 0));
      if (sort === 'bonus') list.sort((a, c) => e.rarityMul(c) - e.rarityMul(a));
      const cur = e.food();
      b.innerHTML = `
        <div class="card"><div class="row"><img data-thumb="${cur.id}" style="width:64px;height:64px;border-radius:14px" alt=""><div class="grow"><div class="desc">Serving now</div><div class="title">${esc(cur.name)}</div><div class="desc">Lv ${s.owned[cur.id].lvl} · +${Math.round((e.rarityMul(cur) - 1) * 100)}% coins</div></div></div></div>

        const it = ITEMS[id], crate = it.kind === 'crate';
        return `<div class="card"><div class="row"><div class="itm ${crate ? 'crate-ic ' + it.crate : 'boost-ic ' + id}"></div><div class="grow"><div class="title">${esc(it.name)} <span class="lvl">×${s.items[id]}</span></div><div class="desc">${esc(it.desc)}</div></div><button class="btn ${crate ? '' : 'gem'}" data-use="${id}">${crate ? 'Open' : 'Use'}</button></div></div>`;
      }).join('') : `<div class="note">Your item bag is empty. Crates from daily rewards land here, and you can buy boosts in Shop → Gem Boosts.</div>`;
      b.querySelectorAll('[data-use]').forEach((x) => x.onclick = () => { this.app.useItem(x.dataset.use); });

  _fcard(f, { locked = false, hint = '' } = {}) {

  // COLLECTION

    const s = this.s, F = this.filter;

    const list = FOODS.filter((f) => inType(f) && (F.rarity === 'all' || f.rarity === F.rarity) && (F.cat === 'all' || f.cat === F.cat));

      <div class="card"><div class="row"><div class="grow"><div class="title">${n} / ${total} collected</div><div class="desc">${total - nat.length} everyday foods and ${nat.length} national dishes (${natGot} found). +1% coins per food, +4% per completed category. Duplicates level foods up (max Lv10).</div><div class="bar"><i style="width:${(n / total) * 100}%"></i></div></div></div></div>
      <div class="filters">${[['all', 'All foods'], ['normal', 'Everyday'], ['national', 'National dishes']].map(([k, nm]) => `<button class="fchip ${F.type === k ? 'on' : ''}" data-t="${k}">${nm}</button>`).join('')}</div>

      this.ui.toast(on ? 'Cheat ON' : 'Cheat OFF', name === 'coins' ? (on ? '+5,500 coins every millisecond' : 'Coin cheat stopped · earned ' + total) : (on ? '+2,000 gems and tokens every millisecond' : 'Gem and token cheat stopped · earned ' + total));
      if (on) { if (name === 'coins') E.coins = 0; else { E.gems = 0; E.tokens = 0; } }
      this._cheatDraw(true);
      this.audio.fanfare(on ? 3 : 1);
    }, true);
    document.addEventListener('keyup', (e) => held.delete((e.key || '').toLowerCase()), true);
    window.addEventListener('blur', () => held.clear());
  }
  // cheat counters show the full number (1,204,344); from a billion up they switch to billions (12.48B)
  static full(n) {
    n = Math.floor(n);
    if (n < 1e9) return n.toLocaleString('en-US');
    return (n / 1e9).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + 'B';
  }
  _runCheats(dt) {
    const c = this.cheat; if (!c || (!c.coins && !c.gems)) return;
    const ms = dt * 1000;
    if (c.coins) { const n = 5500 * ms; this.s.coins += n; c.earned.coins += n; }                       // 5,500 per millisecond
    if (c.gems) { const n = Math.round(2000 * ms); this.s.gems += n; this.s.tokens += n; c.earned.gems += n; c.earned.tokens += n; }  // 2,000 per millisecond
    this._cheatDraw(false);
  }
  _cheatDraw(force) {
    const c = this.cheat, box = this._cheatBox; if (!c || !box) return;
    const now = performance.now(); if (!force && now - c.shown < 80) return; c.shown = now;
    if (!c.coins && !c.gems) { box.style.display = 'none'; return; }
    const row = (bg, glow, label, value) => `<div style="background:${bg};box-shadow:0 6px 24px ${glow},inset 0 0 0 1px #ffffff30;color:#fff;border-radius:999px;padding:6px 16px;font-weight:700;font-size:15px;white-space:nowrap;text-shadow:0 1px 3px #0006;font-variant-numeric:tabular-nums;animation:none">${label} <span style="opacity:.85;font-weight:600">LIVE</span> <b style="font-size:17px">${value}</b></div>`;
    let h = '';
    if (c.coins) h += row('linear-gradient(135deg,#f5b830,#e07a10)', '#f5a52366', '🪙 Coin cheat', '+' + App.full(c.earned.coins));
    if (c.gems) h += row('linear-gradient(135deg,#3aa8ff,#8b5cf6)', '#6d8bff66', '💎 Gem cheat', '+' + App.full(c.earned.gems) + ' gems · +' + App.full(c.earned.tokens) + ' tokens');
    box.innerHTML = h; box.style.display = 'flex';
    // sit right under the coin counter, wherever the layout has moved it (e.g. when a side panel is open)
    const sc = document.getElementById('score'); if (sc) { const r = sc.getBoundingClientRect(); if (r.width) { box.style.left = Math.max(box.offsetWidth / 2 + 8, Math.min(innerWidth - box.offsetWidth / 2 - 8, r.left + r.width / 2)) + 'px'; box.style.top = (r.bottom + 30) + 'px'; } }
  }
  // pre-sculpt a few owned foods while the player is idle so switching is instant, without slowing the start
  _idleSculpt() {
    const ids = Object.keys(this.s.owned).slice(0, 12);
    const idle = window.requestIdleCallback || ((cb) => setTimeout(() => cb({ timeRemaining: () => 8 }), 200));
    const next = () => idle((d) => {
      while (ids.length && d.timeRemaining() > 4) { const f = FOODS.find((x) => x.id === ids.shift()); if (f) foodGeometry(f); }
      if (ids.length) next();
    }, { timeout: 4000 });
    setTimeout(next, 2500);
  }
  // Auto quality: guess from the GPU, then keep adjusting to the real frame rate so slower devices stay smooth
  _autoTier() {
    if (this._tier) return this._tier;
    let tier = matchMedia('(pointer: coarse)').matches || Math.min(innerWidth, innerHeight) < 600 ? 'medium' : 'high';
    try {
      const gl = this.view && this.view.stage.renderer.gl;
      const ext = gl && gl.getExtension('WEBGL_debug_renderer_info');
      const gpu = (ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : '') + ''; this._gpuName = gpu;
      if (/swiftshader|llvmpipe|software|basic render|mesa offscreen/i.test(gpu)) tier = 'low';
      else if (/intel.*(hd|uhd) graphics [2-6]\d{2}\b|mali-[gt][0-9]{1,2}\b|adreno \(tm\) [3-5]\d{2}|powervr/i.test(gpu)) tier = 'medium';
    } catch (e) { /* keep the guess */ }
    if ((navigator.deviceMemory && navigator.deviceMemory <= 4) || (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 2)) tier = tier === 'high' ? 'medium' : tier;
    if (this.view) this._tier = tier;   // only trust the guess once the GPU can be asked
    this._autoScale ||= (tier === 'low' && /swiftshader|llvmpipe|software|basic render/i.test(this._gpuName || '')) ? 0.75 : 1;
    return tier;
  }
  _adapt(dt) {
    if (this.s.settings.quality !== 'auto' || !this._started || document.hidden) return;
    // measured on the wall clock (dt is capped, which would hide how slow a struggling device really is)
    const now = performance.now(), A = (this._ad ||= { t0: now, last: now, n: 0, slow: 0, fast: 0, cool: 0, ups: 0 });
    A.cool = Math.max(0, A.cool - (now - A.last) / 1000); A.last = now; A.n++;
    const span = (now - A.t0) / 1000;
    if (span < 2) return;
    const fps = A.n / span; A.t0 = now; A.n = 0;
    if (A.cool > 0) return;
    if (fps < 40) A.slow++; else A.slow = 0;
    if (fps > 57) A.fast++; else A.fast = 0;
    const tiers = ['low', 'medium', 'high'];
    let i = tiers.indexOf(this._tier), changed = false;
    if (A.slow >= 2) {
      if (i > 0) { this._tier = tiers[i - 1]; changed = true; }
      else if (this._autoScale > 0.5) { this._autoScale = Math.max(0.5, this._autoScale - 0.15); changed = true; }
      A.slow = 0;
    } else if (A.fast >= 8 && A.ups < 1) {   // step back up at most once, so it never flip-flops
      if (this._autoScale < 1) this._autoScale = Math.min(1, this._autoScale + 0.15); else if (i < 2) this._tier = tiers[i + 1];
      A.ups++; A.fast = 0; changed = true;
    }
    if (changed) { A.cool = 4; this.applySettings(); }
  }
  _quality() {
    let q = this.s.settings.quality;
    const auto = q === 'auto';
    if (auto) q = this._autoTier();
    const Q = { ...QUALITY[q] };
    if (auto) Q.scale *= this._autoScale || 1;
    // cap the drawing-buffer density on high-DPI phones
    const dpr = window.devicePixelRatio || 1;
    Q.scale = Math.min(Q.scale, (q === 'ultra' ? 2.5 : 1.75) / dpr);
    return Q;
  }
  applySettings() {
    const st = this.s.settings;
    this.audio.setVolumes(st.sfx, st.music);
    this.audio.setMusic(st.music > 0.01, st.musicStyle || 'classic');
    this._worldKey();
    if (this.view) {
      const Q = this._quality();
      this.view.stage.renderer.setQuality({ renderScale: Q.scale, shadowQuality: Q.shadows, post: Q.post, lowDetail: !!Q.lowDetail });
      this.view.stage.resize();
      this.view.particleLevel = +st.particles;
    }
  }
  saveNow() { save(this.s, store); }
  // each world plays the soundtrack in its own key
  _worldKey() { const w = worldById(this.s.world), i = WORLDS.indexOf(w); this.audio.setChord(w.music, [0, -3, 5, 2, -5, 3, 7, -2][i] || 0); }

  _wire() {
    const v = this.view, e = this.eco;
    v.onClickFood = (hit) => this.hitFood(hit);
    v.onGolden = () => {
      const coins = Math.max(e.cps() * 120, e.clickValue() * 200), gems = 3 + Math.floor(Math.random() * 6);
      e.earn(coins, 'golden'); this.s.gems += gems;
      this.audio.golden();
      const c = v.toScreen(v.stage.camera.target) || { x: innerWidth / 2, y: innerHeight / 2 };
      this.ui.float(c.x, c.y - 60, '+' + fmt(coins), 'burst'); this.ui.float(c.x, c.y - 10, `+${gems} gems`, 'gem');
      this.ui.toast('Golden Bite!', `+${fmt(coins)} coins and ${gems} gems`);
    };
    e.on((type, data) => {
      if (type === 'achievement') { this.audio.fanfare(2); this.ui.toast('Achievement', `${data.name}  ·  +${data.gems} gems`); }
      if (type === 'newfood') { this.ui.toast('New food discovered', `${data.food.name} (${rarityById(data.food.rarity).name})`, data.food); this.ui.setFood(this.eco.food()); }
      if (type === 'frenzy') { this.audio.fanfare(4); this.ui.toast('FRENZY!', `x3 coins and auto-clicks for ${e.frenzyDuration()}s`); }
    });
    // offline earnings
    const off = e.offline();
    if (off > 0) this._offline = off;
  }
  _welcome() {
    if (this._offline) this.ui.modal(`<h3>Welcome back, ${this.s.profile.name}!</h3><div class="desc">Your kitchen kept cooking while you were away.</div><div style="font-size:34px;font-weight:800;margin-top:12px"><i class="ico coin" style="width:30px;height:30px;vertical-align:-4px"></i> ${fmt(this._offline)}</div><div class="btns"><button class="btn" onclick="FF.ui.closeModal()">Collect</button></div>`);
    else if (this.eco.dailyStatus().claimable) setTimeout(() => this.ui.open('daily'), 400);
  }

  hitFood(hit) {
    const r = this.eco.click();
    this.view.react(hit, r);
    const f = this.eco.food();
    this.audio.click(f, r.crit);
    if (this.s.settings.haptics && navigator.vibrate) navigator.vibrate(r.crit ? 25 : 8);
    this.ui.float(hit.screen.x, hit.screen.y, '+' + fmt(r.value), r.crit ? 'crit' : r.dbl ? 'dbl' : '');
    this.ui.bump();
    if (r.burst) {
      this.audio.burst(f);
      setTimeout(() => this.audio.coin(1.2), 120);
      this.ui.float(hit.screen.x, hit.screen.y - 50, '+' + fmt(r.burst.coins), 'burst');
      if (r.burst.gems) this.ui.float(hit.screen.x + 40, hit.screen.y - 10, `+${r.burst.gems} gem${r.burst.gems > 1 ? 's' : ''}`, 'gem');
    }
  }

  frame(dt) {
    const e = this.eco, v = this.view;
    e.tick(dt);
    // frenzy: a storm of automatic hits across the food
    v.frenzy = e.frenzyActive();
    if (v.frenzy) {
      this._fz = (this._fz || 0) + dt;
      while (this._fz > 0.09) {
        this._fz -= 0.09;
        const c = v.toScreen({ x: 0, y: v.stage.foodMesh.geometry.height * 0.55, z: 0 });
        if (c) { const a = Math.random() * Math.PI * 2, rr = Math.random() * 90; const x = c.x + Math.cos(a) * rr, y = c.y + Math.sin(a) * rr * 0.7; const hit = v.pick(x, y); if (hit) { hit.screen = { x, y }; this.hitFood(hit); } }
      }
    }
    v.frame(dt);
    this._runCheats(dt);
    this.ui.hud(dt);
    this._adapt(dt);
  }

  // ------------------------------------------------------------ actions used by the UI
  // the thumbnail renderer is a second WebGL context: create it only once the game is already showing
  thumb(food, cb) {
    if (this.thumbs) { this.thumbs.request(food, cb); return; }
    (this._thumbQ ||= []).push([food, cb]);
    if (this._thumbTimer) return;
    this._thumbTimer = setTimeout(() => {
      this._thumbTimer = 0;
      try { this.thumbs = new Thumbnailer(200); } catch (e) { console.warn('thumbnails unavailable', e); this._thumbQ = []; return; }
      for (const [f, c] of this._thumbQ.splice(0)) this.thumbs.request(f, c);
    }, this._started ? 30 : 1200);
  }
  preview(canvas, food, locked) {
    if (!this.prev) this.prev = new Thumbnailer(480);
    const ctx = canvas.getContext('2d');
    const pv = this.prev, st = pv.stage;
    st.setWorld(worldById(food.world)); st.set.visible = false;
    st.setFood(pv._geo(food), foodMaterial);
    st.resize();
    canvas.style.filter = locked ? 'brightness(0) drop-shadow(0 0 1px #fff)' : '';
    const run = () => {
      if (!document.getElementById('modal').classList.contains('show') || !canvas.isConnected) return;
      st.pivot.quaternion.setEuler(0, st.time * 0.8, 0);
      st.pivot.position.y = Math.sin(st.time * 2) * 0.04;
      st.render(1 / 60);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(pv.canvas, 0, 0, canvas.width, canvas.height);
      requestAnimationFrame(run);
    };
    run();
  }
  selectFood(id) {
    if (!this.eco.select(id)) return;
    const f = this.eco.food();
    this.audio.swap();
    this.view.onSwapDone = () => { this.ui.setFood(f); };
    this.view.setFood(f);
    this.ui.setFood(f);
    if (['home', 'collection', 'inventory'].includes(this.ui.page)) this.ui.rerender();
    this.saveNow();
  }
  enterWorld(id) {
    if (!this.eco.setWorld(id)) return;
    const w = worldById(id);
    this.view.setWorld(id); this.ui.setWorld(w);
    this._worldKey(); this.audio.fanfare(1);
    this.ui.toast('Welcome to', w.name);
    this.ui.rerender(); this.saveNow();
  }
  buyWorld(id) {
    if (this.eco.unlockWorld(id)) { this.audio.fanfare(3); this.enterWorld(id); this.ui.toast('World unlocked', worldById(id).name); }
    else this.audio.deny();
  }
  buyUpgrade(id) { if (this.eco.buyUpgrade(id)) { this.audio.buy(); this.ui.refresh?.(); this.ui.setFood(this.eco.food()); } else this.audio.deny(); }
  buyProducer(id, n) { if (this.eco.buyProducer(id, n)) { this.audio.buy(); this.ui.refresh?.(); } else this.audio.deny(); }
  buyBoost(id, cost) {
    const s = this.s;
    if (s.gems < cost) return this.audio.deny();
    s.gems -= cost;
    this.eco.addItem(id);
    this.audio.buy(); this.ui.toast('Added to Inventory', ITEMS[id].name); this.ui.rerender(); this.saveNow();
  }
  useItem(id) {
    const e = this.eco, s = this.s, it = ITEMS[id];
    if (!it || !e.hasItem(id)) return this.audio.deny();
    if (id === 'boost_frenzy' && (e.lvl('frenzy') < 1 || e.frenzyActive())) { this.audio.deny(); this.ui.toast('Not yet', e.lvl('frenzy') < 1 ? 'Buy the Frenzy Mode upgrade first' : 'Frenzy is already running'); return; }
    e.takeItem(id);
    if (it.kind === 'crate') { const res = e.openCrate(it.crate, true); this.showCrate(res, it.crate); this.saveNow(); return; }
    if (id === 'boost_coins2') { s.boosts.push({ kind: 'coins2', until: e.now() + 30 * 60000 }); this.ui.toast('Boost active', 'Double coins for 30 minutes'); }
    if (id === 'boost_feast') { const v = Math.max(e.cps() * 900, e.clickValue() * 50); e.earn(v); this.ui.toast('Instant Feast', '+' + fmt(v) + ' coins'); }
    if (id === 'boost_frenzy') { s.frenzyUntil = e.now() + e.frenzyDuration() * 1000; s.stats.frenzies++; this.audio.fanfare(4); this.ui.toast('FRENZY!', 'x3 coins'); }
    if (id === 'boost_knife') { const r = e.burst(); this.view.burst(); this.audio.burst(e.food()); this.ui.toast('Sharp Knife', `Burst! +${fmt(r.coins)} coins`); }
    this.audio.buy(); this.ui.rerender(); this.saveNow();
  }
  cycleFood(dir) {
    if (Object.keys(this.s.owned).length < 2) { this.audio.deny(); this.ui.toast('Only one food so far', 'Open crates in your Inventory or the Shop to get more'); return; }
    this.selectFood(this.eco.nextOwned(dir).id);
  }
  claimDaily() {
    const r = this.eco.claimDaily(); if (!r) return;
    this.audio.fanfare(2);
    const parts = [r.gems && `${r.gems} gems`, r.coins && `${fmt(r.coins)} coins`, r.tokens && `${r.tokens} token`, r.boost && '2x coins for 30 min'].filter(Boolean);
    if (r.item) parts.push(ITEMS[r.item].name + ' (in Inventory)');
    this.ui.toast(r.label.replace(' (to Inventory)', ''), parts.join(' + '));
    this.saveNow();
  }
  openCrate(id) {
    if (!this.eco.canAffordCrate(id)) return this.audio.deny();
    const res = this.eco.openCrate(id);
    if (!res) return this.audio.deny();
    this.showCrate(res, id);
    this.saveNow();
  }
  showCrate(res, kind) {
    const m = this.ui.modal(`<div class="crate ${kind}"><div class="box"></div></div><div class="desc">Opening…</div>`, { dismiss: false });
    this.audio.drumroll(1.1);
    const tier = RARITIES.findIndex((r) => r.id === res.food.rarity);
    setTimeout(() => {
      const r = rarityById(res.food.rarity);
      this.audio.fanfare(tier + 1);
      m.innerHTML = `<div class="reveal" style="--rc:${r.color}"><div class="rays"></div><img alt=""></div>
        <div class="rname" style="color:${r.color}">${r.name}</div><h3>${res.food.name}</h3>
        <div class="desc">${res.dup ? (res.levelUp ? `Duplicate! Levelled up to Lv ${res.levelUp}.` : `Max level already, converted to ${fmt(res.refund)} coins.`) : 'New food for your collection!'}</div>
        <div class="btns"><button class="btn ghost" id="cClose">Nice!</button><button class="btn" id="cServe">Serve it</button></div>`;
      this.thumb(res.food, (u) => { const i = m.querySelector('.reveal img'); if (i) i.src = u; });
      m.querySelector('#cClose').onclick = () => this.ui.closeModal();
      m.querySelector('#cServe').onclick = () => { this.ui.closeModal(); this.selectFood(res.food.id); };
      this.ui._modalDismiss = true;
      if (this.ui.page) this.ui.rerender();
    }, 1150);
  }
  confirmRebirth() {
    const t = this.eco.rebirthTokens(); if (!t) return this.audio.deny();
    const m = this.ui.modal(`<h3>Rebirth?</h3><div class="desc">You will restart with 0 coins and no upgrades or auto-clickers, but keep every food, gem, world and achievement.</div><div style="font-size:30px;font-weight:800;margin:14px 0"><i class="ico token" style="width:26px;height:26px"></i> +${t} token${t === 1 ? '' : 's'}</div><div class="desc">+${t * 10}% coins forever, plus tokens to spend on perks.</div><div class="btns"><button class="btn ghost" id="no">Not yet</button><button class="btn token" id="yes">Rebirth</button></div>`);
    m.querySelector('#no').onclick = () => this.ui.closeModal();
    m.querySelector('#yes').onclick = () => { const r = this.eco.rebirth(); this.ui.closeModal(); this.audio.fanfare(5); this.ui.toast('Reborn!', `+${r.tokens} tokens`); this.ui.shownCoins = 0; this.ui.rerender(); this.saveNow(); };
  }
  replaceState(s) {
    const base = newState(); for (const k of Object.keys(base)) if (s[k] === undefined) s[k] = base[k];
    this.eco.s = this.state = s; this.saveNow(); location.reload();
  }
  resetAll() { store.removeItem(SAVE_KEY); this._noSave = true; this.saveNow = () => {}; location.reload(); }
}

new App().boot();

return {  };
})();

</script>
</body>
