<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AriexCars</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Barlow:wght@400;500;600;700&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Layout: full-bleed live 3D world; menu = left rail + glass panel; HUD = instrument cluster corners */
:root{
  color-scheme:dark;
  --bg:#080c14; --panel:rgba(13,19,31,.80); --panel-2:rgba(22,31,48,.86); --line:rgba(150,185,230,.16);
  --ink:#ecf2fa; --muted:#8c99ae; --ice:#53d6ff; --heat:#ff6a2b; --gold:#ffc44d; --ok:#4fe39a; --bad:#ff4d5e;
  --blue-team:#3d8bff; --red-team:#ff4d5e;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-data:"Chakra Petch","Consolas","Menlo",monospace;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px}
body{margin:0;-webkit-user-select:none;user-select:none;touch-action:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--bg)}
button{font-family:var(--f-body);color:var(--ink);cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.layer{position:fixed;inset:0;z-index:10}
.hidden,[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f-display);letter-spacing:.02em;margin:0;text-wrap:balance}
.lbl{font-family:var(--f-data);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}

/* boot + intro */
#boot{background:radial-gradient(120% 90% at 50% 110%,#13233d 0%,var(--bg) 60%);display:grid;place-items:center;z-index:50}
.boot-in{display:grid;gap:18px;justify-items:center;width:min(520px,86vw)}
.logo{font-family:var(--f-display);font-weight:900;font-size:clamp(54px,11vw,120px);line-height:.85;letter-spacing:.04em;font-style:italic;
  background:linear-gradient(100deg,#fff 0%,#cfe9ff 40%,var(--ice) 60%,#fff 80%);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:250% 100%;animation:sheen 3.4s linear infinite}
.logo span{display:inline-block}
@keyframes sheen{to{background-position:-250% 0}}
.byline{font-family:var(--f-data);letter-spacing:.42em;font-size:12px;color:var(--gold);text-transform:uppercase}
.bar{width:100%;height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ice),#fff);transition:width .25s}
#bootTxt{font-family:var(--f-data);font-size:12px;color:var(--muted);letter-spacing:.1em}
#intro{z-index:45;display:grid;place-items:center;background:rgba(0,0,0,.35);cursor:pointer;overflow:hidden}
#intro .logo span{opacity:0;transform:translateY(40px) skewX(-12deg);animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
#intro .streak{position:absolute;left:-40%;top:50%;width:40%;height:2px;background:linear-gradient(90deg,transparent,#fff,transparent);animation:streak 1.6s .9s ease-in-out forwards;filter:drop-shadow(0 0 12px var(--ice))}
#intro .byline{opacity:0;animation:fade .8s 1.4s forwards}
#intro .skip{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom,0px));right:calc(24px + env(safe-area-inset-right,0px));font-family:var(--f-data);font-size:11px;color:var(--muted);letter-spacing:.2em}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes streak{to{left:110%}}
@keyframes fade{to{opacity:1}}

/* menu */
#menu{display:grid;grid-template-columns:auto 1fr;pointer-events:none}
#menu>*{pointer-events:auto}
#nav{display:flex;flex-direction:column;gap:2px;padding:max(18px,env(safe-area-inset-top,0px)) 10px 18px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(90deg,rgba(6,9,15,.92),rgba(6,9,15,.55));border-right:1px solid var(--line);width:200px;overflow-y:auto}
#nav .brand{font-family:var(--f-display);font-weight:900;font-style:italic;font-size:30px;line-height:.9;padding:4px 8px 2px}
#nav .brand small{display:block;font-family:var(--f-data);font-style:normal;font-weight:600;font-size:9px;letter-spacing:.32em;color:var(--gold);margin-top:6px}
#nav .sep{height:14px}
.navb{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:.06em;color:var(--muted);position:relative;transition:color .2s,background .2s,transform .2s}
.navb:hover{color:var(--ink);background:rgba(83,214,255,.07);transform:translateX(3px)}
.navb.on{color:var(--ink);background:rgba(83,214,255,.12)}
.navb.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;background:var(--ice);border-radius:2px;box-shadow:0 0 10px var(--ice)}
.navb:focus-visible{outline:2px solid var(--ice)}
#pages{position:relative;overflow:hidden}
.page{position:absolute;inset:0;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 28px;opacity:0;transform:translateX(24px);transition:opacity .35s,transform .45s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.page.on{opacity:1;transform:none;pointer-events:auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.ph{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.ph h2{font-size:clamp(34px,5vw,52px);font-weight:900;font-style:italic;line-height:.9}
.wrap{max-width:1040px;display:grid;gap:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.btn{border:1px solid var(--line);background:var(--panel-2);padding:11px 18px;border-radius:8px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px;transition:transform .15s,border-color .2s,background .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);border-color:rgba(83,214,255,.5);box-shadow:0 8px 24px -10px rgba(83,214,255,.5)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.pri{background:linear-gradient(180deg,#6fe0ff,#2fb6e6);color:#04121c;border-color:transparent}
.btn.hot{background:linear-gradient(180deg,#ff8a50,#ff5a1f);color:#1a0700;border-color:transparent}
.btn.sm{padding:7px 12px;font-size:11px}
.btn[disabled]{opacity:.4;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:8px;align-content:start;padding:16px;border-radius:10px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:transform .2s,border-color .2s,background .2s;min-width:0}
.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:rgba(83,214,255,.55);background:var(--panel-2)}
.card h3{font-size:24px;font-weight:800;line-height:1}
.card p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
.card .tag{justify-self:start;font-family:var(--f-data);font-size:10px;letter-spacing:.14em;padding:3px 7px;border-radius:4px;background:rgba(83,214,255,.14);color:var(--ice)}
.card .tag.main{background:rgba(79,227,154,.16);color:var(--ok)}
.card .tag.net{background:rgba(255,196,77,.16);color:var(--gold)}
.mnum{font-family:var(--f-data);color:var(--muted);font-size:11px}
.hero{display:grid;gap:14px;max-width:640px;padding-top:6vh}
.hero .logo{font-size:clamp(64px,10vw,132px)}
.hero p{color:#c7d3e4;font-size:17px;line-height:1.5;max-width:52ch;margin:0}
.feature{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;border-left:3px solid var(--ok)}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 9px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--muted)}
.chip.on{border-color:var(--ice);color:var(--ink);background:rgba(83,214,255,.1)}
.stat{display:grid;grid-template-columns:90px 1fr 44px;gap:10px;align-items:center;font-size:12px}
.stat .track{height:6px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden}
.stat .track i{display:block;height:100%;background:linear-gradient(90deg,var(--ice),#c9f3ff)}
.field{display:grid;gap:6px}
.field input,.field select{background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--ink);padding:10px 12px;border-radius:8px;font:inherit}
input[type=range]{accent-color:var(--ice);width:100%}
input[type=color]{width:44px;height:36px;border:1px solid var(--line);border-radius:8px;background:none;padding:2px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.15);cursor:pointer;padding:0}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--ice)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:8px 12px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.seg button.on{background:rgba(83,214,255,.16);color:var(--ink)}
.seg button:focus-visible{outline:2px solid var(--ice)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-family:var(--f-data);font-size:10px;letter-spacing:.14em;color:var(--muted);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:8px 6px;border-bottom:1px solid rgba(150,185,230,.07)}
.split{display:grid;grid-template-columns:minmax(0,380px) 1fr;gap:16px;align-items:start}
.carlist{display:grid;gap:6px;max-height:52vh;overflow-y:auto}
.citem{all:unset;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 12px;border-radius:8px;border:1px solid transparent;background:rgba(255,255,255,.03)}
.citem.on{border-color:var(--ice);background:rgba(83,214,255,.08)}
.citem b{font-weight:600}.citem small{color:var(--muted);font-size:11px}
.lock{color:var(--gold);font-family:var(--f-data);font-size:11px}
.credits{font-family:var(--f-data);color:var(--gold);font-weight:700}

/* modal */
#modal{z-index:30;display:grid;place-items:center;background:rgba(3,6,12,.6);padding:16px}
#modal .panel{width:min(560px,100%);max-height:88vh;overflow-y:auto;display:grid;gap:14px}

/* HUD */
#hud{pointer-events:none;z-index:12}
#hud>*{position:absolute}
#hudTop{top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:grid;justify-items:center;gap:6px;text-align:center}
#hudTimer{font-family:var(--f-data);font-weight:700;font-size:34px;letter-spacing:.04em;text-shadow:0 2px 12px rgba(0,0,0,.6)}
#hudMode{font-family:var(--f-display);font-weight:800;font-size:16px;letter-spacing:.18em;color:var(--ice);text-shadow:0 1px 8px rgba(0,0,0,.7)}
#hudInfo{font-family:var(--f-data);font-size:15px;background:rgba(5,9,16,.6);padding:6px 14px;border-radius:6px;border:1px solid var(--line);white-space:nowrap}
#hudInfo:empty{display:none}
#speedo{right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:200px;height:200px}
#speedo canvas{width:100%;height:100%}
#speedTxt{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
#speedTxt b{font-family:var(--f-data);font-size:44px;font-weight:700;line-height:1}
#speedTxt span{font-family:var(--f-data);font-size:11px;color:var(--muted);letter-spacing:.2em}
#gearTxt{font-family:var(--f-data);font-size:18px;color:var(--ice);margin-top:4px}
#dmg{right:calc(230px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));width:120px;display:grid;gap:4px}
#dmg .bar{height:6px}#dmg .bar i{background:linear-gradient(90deg,var(--ok),var(--gold),var(--bad))}
#district{position:absolute;left:calc(16px + env(safe-area-inset-left,0px));top:calc(194px + env(safe-area-inset-top,0px));width:170px;text-align:center;font-size:11px;font-weight:800;letter-spacing:.16em;color:#fff;text-shadow:0 1px 4px #000,0 0 10px #000;pointer-events:none}
body.touch #district{top:calc(142px + env(safe-area-inset-top,0px));width:120px;font-size:9px}
#minimap{left:calc(16px + env(safe-area-inset-left,0px));top:calc(16px + env(safe-area-inset-top,0px));width:170px;height:170px;border-radius:50%;border:2px solid var(--line);background:rgba(4,8,14,.7);overflow:hidden}
#board{right:calc(16px + env(safe-area-inset-right,0px));top:calc(16px + env(safe-area-inset-top,0px));width:230px;background:rgba(5,9,16,.66);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:3px;font-size:12px;backdrop-filter:blur(8px)}
#board:empty{display:none}
#board .r{display:grid;grid-template-columns:18px 1fr auto;gap:6px;align-items:center;padding:3px 4px;border-radius:4px}
#board .r.me{background:rgba(83,214,255,.12)}
#board .r.out{opacity:.4;text-decoration:line-through}
#board .dot{width:9px;height:9px;border-radius:50%}
#banner{left:50%;top:34%;transform:translate(-50%,-50%);font-family:var(--f-display);font-weight:900;font-style:italic;font-size:clamp(46px,9vw,110px);text-align:center;text-shadow:0 4px 30px rgba(0,0,0,.6);white-space:nowrap;opacity:0;transition:opacity .25s}
#banner.show{opacity:1;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
#banner small{display:block;font-size:.26em;font-style:normal;letter-spacing:.2em;font-family:var(--f-data);color:var(--gold);margin-top:6px}
@keyframes pop{from{transform:translate(-50%,-50%) scale(1.5)}to{transform:translate(-50%,-50%) scale(1)}}
#meter{left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(320px,60vw);display:grid;gap:4px;text-align:center}
#meter .bar{height:8px}#meter .bar i{background:linear-gradient(90deg,var(--gold),var(--bad))}
#drift{left:50%;top:22%;transform:translateX(-50%);text-align:center;font-family:var(--f-data)}
#drift b{font-size:40px;color:var(--gold);display:block;text-shadow:0 2px 14px rgba(0,0,0,.6)}
#drift span{font-size:13px;letter-spacing:.2em;color:var(--ink)}
#arrow{left:50%;top:calc(96px + env(safe-area-inset-top,0px));width:44px;height:44px;margin-left:-22px}
#feed{left:calc(16px + env(safe-area-inset-left,0px));top:calc(200px + env(safe-area-inset-top,0px));display:grid;gap:4px;font-size:13px;font-family:var(--f-data)}
#feed div{background:rgba(5,9,16,.7);padding:5px 10px;border-radius:5px;border-left:3px solid var(--ice);animation:fade .3s;opacity:1}
#fps{left:calc(200px + env(safe-area-inset-left,0px));top:calc(16px + env(safe-area-inset-top,0px));font-family:var(--f-data);font-size:11px;color:var(--muted)}
#hudBtns{right:calc(16px + env(safe-area-inset-right,0px));top:calc(16px + env(safe-area-inset-top,0px));display:flex;gap:6px;pointer-events:auto}
#board:not(:empty)~#hudBtns{top:auto;bottom:calc(230px + env(safe-area-inset-bottom,0px))}
.hb.on{border-color:var(--heat);color:var(--heat);background:rgba(255,106,43,.15)}
.hb{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:rgba(5,9,16,.66);font-family:var(--f-data);font-size:11px;font-weight:700}

/* touch */
#touch{z-index:13;pointer-events:none}
#touch .tb{position:absolute;pointer-events:auto;border-radius:50%;border:2px solid rgba(255,255,255,.22);background:rgba(10,16,26,.45);display:grid;place-items:center;font-family:var(--f-data);font-weight:700;font-size:13px;color:#fff;touch-action:none;backdrop-filter:blur(6px)}
#touch .tb.act{background:rgba(83,214,255,.38);border-color:var(--ice)}
#tLeft{left:calc(20px + env(safe-area-inset-left,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));width:86px;height:86px}
#tRight{left:calc(122px + env(safe-area-inset-left,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));width:86px;height:86px}
#tWheel{left:calc(24px + env(safe-area-inset-left,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:160px;height:160px;border-radius:50%!important}
#tGas{right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));width:96px;height:96px;background:rgba(79,227,154,.25)!important}
#tBrake{right:calc(134px + env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:76px;height:76px;background:rgba(255,77,94,.22)!important}
#tHand{right:calc(40px + env(safe-area-inset-right,0px));bottom:calc(138px + env(safe-area-inset-bottom,0px));width:64px;height:64px}
body.touch #speedo{width:130px;height:130px;right:auto;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom,0px))}
body.touch #speedTxt b{font-size:28px}
body.touch #dmg{display:none}
body.touch #minimap{width:120px;height:120px}

/* overlays */
#pause,#results{z-index:25;display:grid;place-items:center;background:rgba(3,6,12,.66);padding:16px}
#pause .panel,#results .panel{width:min(480px,100%);display:grid;gap:12px;text-align:center}
#pause h2,#results h2{font-size:56px;font-style:italic;font-weight:900}
#results .big{font-family:var(--f-display);font-weight:900;font-size:clamp(48px,9vw,84px);font-style:italic;line-height:.9}
#coinLive{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:70;padding:10px 18px;border-radius:999px;background:rgba(20,14,0,.85);border:1px solid var(--gold);color:var(--gold);font:700 20px var(--f-data);pointer-events:none;white-space:nowrap}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:grid;gap:6px;pointer-events:none}
#toast div{background:var(--panel-2);border:1px solid var(--line);padding:10px 16px;border-radius:8px;font-size:13px;animation:fade .25s}
@media (max-width:760px){
  #menu{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  #nav{flex-direction:row;width:auto;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:max(8px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));align-items:center}
  #nav .brand{font-size:20px;white-space:nowrap}#nav .brand small{display:none}#nav .sep{display:none}
  .navb{font-size:15px;white-space:nowrap;padding:7px 9px}.navb.on::before{display:none}
  .page{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .split{grid-template-columns:1fr}
  #board{width:170px;font-size:11px}
  #minimap{width:120px;height:120px}
}

/* economy + showroom */
.bal{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));z-index:11;padding:7px 14px;border-radius:999px;background:linear-gradient(180deg,rgba(255,196,77,.18),rgba(255,196,77,.06));border:1px solid rgba(255,196,77,.5);color:var(--gold);font-weight:700;letter-spacing:.06em;font-size:14px;pointer-events:none}
.col{display:grid;gap:12px;align-content:start}
.cname{font-size:30px;font-weight:900;font-style:italic;line-height:.95}
.sub{color:var(--muted);font-size:12px;line-height:1.4}.sub.ok{color:var(--ok)}
.split .panel.col{max-height:calc(100vh - 48px);overflow-y:auto}
.viewport{position:relative;min-height:62vh;border-radius:12px;cursor:grab;touch-action:none;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;padding:10px}
.viewport:active{cursor:grabbing}
.viewport{padding-top:58px}.vbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.vbtns .chip{cursor:pointer;background:rgba(5,9,16,.6)}
.vhint{font-family:var(--f-data);font-size:11px;color:var(--muted);background:rgba(5,9,16,.55);padding:4px 10px;border-radius:6px}
.tabs .chip,.chip[data-f],.chip[data-cat],.chip[data-h],.chip[data-t]{cursor:pointer;background:none}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}

const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.2, 4000);

  uniforms: { tDiffuse: { value: null }, uContrast: { value: 1.08 }, uSat: { value: 1.1 }, uWarm: { value: new THREE.Vector3(1.03, 1.0, 0.96) }, uCool: { value: new THREE.Vector3(0.96, 1.0, 1.05) }, uVig: { value: 0.28 }, uBlur: { value: 0 } },
